<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ikon aplikasi di layar HP: latar biru penuh (aman dipotong bulat/kotak oleh HP), uang kertas + koin di tengah -->
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0072FF"/><stop offset="1" stop-color="#0049B8"/></linearGradient>
    <linearGradient id="gNote" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#63D697"/><stop offset="1" stop-color="#2A9A5F"/></linearGradient>
    <linearGradient id="gCoin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE48A"/><stop offset="1" stop-color="#F0A41A"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#gBg)"/>
  <circle cx="256" cy="256" r="168" fill="#fff" opacity=".14"/>
  <g transform="translate(96 96) scale(5)">
    <g transform="rotate(-14 28 26)">
