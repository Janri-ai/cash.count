      <circle cx="12.5" cy="20" r="1.7" fill="#C4F2D9"/>
      <circle cx="39.5" cy="32" r="1.7" fill="#C4F2D9"/>
    </g>
    <circle cx="45" cy="44" r="14.5" fill="#001A5A" opacity=".16"/>
    <circle cx="44" cy="42" r="14" fill="url(#gCoin)" stroke="#CF8A0B" stroke-width="1.6"/>
    <circle cx="44" cy="42" r="10" fill="none" stroke="#E7A01A" stroke-width="1.4"/>
    <text x="44" y="46.2" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#965C00">Rp</text>
